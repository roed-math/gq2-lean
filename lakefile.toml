name = "GQ2"
defaultTargets = ["GQ2"]

[leanOptions]
pp.unicode.fun = true
autoImplicit = false
relaxedAutoImplicit = false

# Dev tooling (NOT imported by GQ2): the Lean Atlas dependency-graph viewer.
# Pinned at the commit verified to build under this project's v4.35.0 toolchain.
# Has no shared transitive deps, so it does not affect Mathlib's pin precedence.
[[require]]
name = "lean-atlas"
scope = "NyxFoundation"
git = "https://github.com/NyxFoundation/lean-atlas"
rev = "3a81e194db0e6c41a2a8c5286f9e1b4962c3866a"

# Tau Ceti (https://github.com/TauCetiProject/TauCeti), source of the proofs of the nine
# literature inputs. Pinned at main 706344c (2026-10-16); its manifest pins Mathlib at
# cfc55fc, which the Mathlib require below matches. Move both pins together.
[[require]]
name = "TauCeti"
git = "https://github.com/TauCetiProject/TauCeti"
rev = "706344c35426d3df6931a2457271dceb3f9ac507"

# `require mathlib` last so Mathlib's pinned versions of shared transitive
# dependencies (proofwidgets, batteries, …) take precedence over those of the
# other requires.  Pinned at cfc55fc, Tau Ceti's Mathlib revision, for reproducibility.
[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "cfc55fc58714a59dc06e6e79edc6d1d95140d3c2"

[[lean_lib]]
name = "GQ2"

# Comparator (leanprover/comparator) verification pair for the main theorem;
# see comparator-config.json and formalization.yaml.
[[lean_lib]]
name = "Challenge"

[[lean_lib]]
name = "Solution"

# Axiom-free Comparator pair: the literature results are explicit bundled hypotheses.
[[lean_lib]]
name = "ChallengePalomar"

[[lean_lib]]
name = "SolutionPalomar"
