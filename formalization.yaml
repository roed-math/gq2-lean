status:
  scope: >
    Complete end-to-end formalization of the paper's main result (numbered Theorem 1.2
    in the retained original PDF): the absolute Galois group of Q_2 is isomorphic as a
    profinite group to an explicit 4-generator 2-relator marked quotient Gamma_A,
    together with the surjection-count form (for every finite G, the number of
    continuous surjections G_Q2 ->> G equals the number of admissible marked
    quadruples in G^4).

    This metadata records the explicit-input route. The capstone
    GQ2.main_presentation_literal_of_inputs is sorry-free and takes
    [LiteratureInputs] as an explicit bundled hypothesis containing the nine cited
    local-arithmetic results that Mathlib does not yet provide. Its proof term uses
    only Lean's standard three axioms: propext, Classical.choice, and Quot.sound. This
    repository does not construct a LiteratureInputs instance without assumptions, so
    the standard-three axiom print does not claim proofs of those nine inputs.

    A second capstone, GQ2.main_presentation_literal_roe_unconditional_of_inputs,
    proves the same literal isomorphism for the different candidate group Gamma_R.
    The theorem remains conditional on the same explicit LiteratureInputs bundle
    as the Gamma_A result.
  # Counts and axiom inventory for the explicit-input route.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms:
    - "propext"
    - "Classical.choice"
    - "Quot.sound"
  main_results:
    - declaration: "GQ2.main_presentation_literal_of_inputs"
      file: "GQ2/PresentationLiteralWithInputs.lean"
      sorry_count: 0
      axioms:
        - "propext"
        - "Classical.choice"
        - "Quot.sound"
      comparator_config: "comparator-config-palomar.json"
      literature_dependencies:
        - statement: "G_Q2 is topologically finitely generated (B1)"
          source: "Appendix B of the source paper; precise citation in docs/literature-axioms.md"
        - statement: "local Euler characteristic formula at p = 2 (B7)"
          source: "Appendix B of the source paper; precise citation in docs/literature-axioms.md"
        - statement: "dyadic orientation / cyclotomic normalization (B3c)"
          source: "Appendix B of the source paper; precise citation in docs/literature-axioms.md"
        - statement: "local reciprocity (local class field theory) for Q_2 (B5)"
          source: "Appendix B of the source paper; precise citation in docs/literature-axioms.md"
        - statement: "local Tate duality at finite extensions k/Q_2 (B6, base-generalized)"
          source: "Appendix B of the source paper; precise citation in docs/literature-axioms.md"
        - statement: "peripheral cyclotomic action (B8)"
          source: "Appendix B of the source paper; precise citation in docs/literature-axioms.md"
        - statement: "relative Stiefel-Whitney identity (Evens-Kahn/Kozlowski), dyadic case (B9)"
          source: "Appendix B of the source paper; precise citation in docs/literature-axioms.md"
        - statement: "oriented tame quotient structure of G_Q2 (B10)"
          source: "Appendix B of the source paper; precise citation in docs/literature-axioms.md"
        - statement: "Hilbert-symbol norm criterion for finite dyadic extensions (B11a)"
          source: "Appendix B of the source paper; precise citation in docs/literature-axioms.md"
    - declaration: "GQ2.main_presentation_literal_roe_unconditional_of_inputs"
