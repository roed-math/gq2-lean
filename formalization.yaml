automation:
  methods:
    - method: "agent"
      models: ["claude-opus-4-8", "claude-fable-5"]
      framework: "Claude Code"
      tool_setup: >
        Multi-agent orchestrator-worker swarm: a main orchestrating session dispatched
        parallel worker agents per ticket/file, coordinated through an on-disk ticket
        board, per-ticket plans, and handoff documents (raw archive preserved in
        docs/orchestration/). Workers used the lean-lsp MCP server and streaming
        `lake build` verification; an axiom-hygiene gate (scripts/check_axioms.sh)
        enforced the literature-input dependency boundary, zero sorries, and no
        native_decide on every wave. A post-completion 34-wave cleanup marathon (mathlib-quality skill
        suite: per-file golf, renames, cross-file dedup, proof decomposition, file
        splitting) improved the Lean code quality, though not up to mathlib standards.
      cost:
        wall_time: "~2 weeks wall clock (2026-07-01 to 2026-07-14); main proof complete 2026-07-08"
        spend_usd: "$600 (three Claude Max 20 subscriptions)"
        hardware: "a single Macbook Pro laptop"
      prompting_notes: >
        Per-ticket briefs with acceptance criteria and axiom budgets (see
        docs/orchestration/tickets.md and p*.md plan files); cleanup-phase worker
        prompts enforced byte-identical theorem statements, streaming-only builds,
        and anti-destruction rules for parallel lanes.
    - method: "AI-assisted"
      models: ["gpt-5.6"]
      framework: "OpenAI Codex"
      tool_setup: >
        Repository inspection, Lean refactoring, kernel builds, environment-level axiom
        audits, metadata validation, and Comparator packaging.
      cost:
        wall_time: "one implementation session"
        spend_usd: "subscription-based"
        hardware: "local development container plus API"
      prompting_notes: >
        Refactor the literature-dependent proof graph to take an explicit bundled
        hypothesis and package the explicit-input Palomar Comparator entry points.
    - method: "agent"
      models: ["claude-opus-5-5", "claude-fable-5-1"]
      framework: "Claude Code"
      tool_setup: >
        Tau Ceti discharge campaign: an orchestrating session dispatched worker agents
        per ticket through an on-disk board (docs/orchestration/tauceti-tickets.md, plan
        docs/orchestration/tauceti-proof-plan.md): the Lean v4.35.0 / Mathlib bump to
        Tau Ceti's Mathlib revision, shared dictionaries and one adapter per literature
        input in GQ2/TauCeti/, the Tau Ceti capstones and audit, and the census flip.
      cost:
        wall_time: "2026-10-16 to 2026-10-17"
        spend_usd: "not recorded"
        hardware: "a Linux server"
      prompting_notes: >
        Per-ticket briefs with acceptance criteria: theorem statements byte-identical
        through the Mathlib bump, every adapter at the standard three axioms, and owner
        gates for the trust-base change (G0) and the census flip (G1).
  spend_usd: "$600 (three Claude Max 20 subscriptions)"
  notes: >
    Human role was orchestration-level: approving trust-base changes, owner-gated
    design decisions, and review checkpoints; the Lean code was written by the agent
    swarm. Commit trailers record the models used per commit.

fidelity:
  divergences: >
    Statements track the paper closely; module docstrings carry paper-tag ledgers
    mapping equations and propositions to declarations. Known deviations: (i) the nine
    literature inputs are cited results, not the paper's own, and their Lean statements
    are encodings of the cited theorems chosen in this repository; docs/literature-axioms.md
    records, per input, the citation, its faithfulness class and the encoding choices.
    Until 2026-10-17 these statements were assumed as axioms; they are now proved from
    Tau Ceti (revision 706344c35) by the adapters in GQ2/TauCeti/, with statements
    byte-identical to the former axioms. Any remaining divergence from the cited
    formulations therefore lies in those statement encodings, which did not change.
    Convention differences with Tau Ceti (for example arithmetic versus geometric
    Frobenius in B5 and B10) are reconciled inside the adapters' proofs, not in the
    statements. The bundled B7 field of LiteratureInputs uses `M : Type`, which covers
    every consumer in this development; the legacy B7 theorem keeps `M : Type*` by
    transport along a `Fin (Nat.card M)` copy of `M`;
    (ii) a transcription erratum in the paper's H^0 bookkeeping was found and corrected
    during formalization (docs/erratum-h0-transcription.md); (iii) helper-lemma names
    follow mathlib conventions rather than paper numbering; (iv) on 2026-07-24 B9 was
    restated as the relative Stiefel-Whitney identity
    (relativeStiefelWhitney_dyadic), and the previous composite B9 statement is now a
    derived theorem (evensKahn_dyadic) proved from it plus B11a; (v) the Gamma_R
    "Replacement theorem" (GQ2/Roe/) is not part of the paper and verifies a different
    candidate group proposed afterward. Its former extra input, the Labute
    classification instance, was carried as the explicit theorem binder BLabHypothesis
    rather than admitted as an axiom, and was discharged in-repository on 2026-07-26 by
    GQ2.Roe.Labute.bLab. Thus GQ2.main_presentation_literal_roe_unconditional rests on
    exactly what the Gamma_A capstone rests on (the standard three axioms, with the
    literature inputs proved from Tau Ceti), and the `_of_inputs` Gamma_R capstone is
    unconditional with respect to BLabHypothesis and parametrized by LiteratureInputs
    like the Gamma_A one.

review:
  status: "agent-reviewed"
  reviewers: []
  notes: >
    No external human peer review yet. Internal review includes a foundations audit
    (docs/foundations-audit.md), off-path statement checks
    (docs/off-path-statements.md), kernel-checked builds, zero-sorry enforcement, and
    transitive environment audits: scripts/check_axioms.sh enforces axiom census 0, no
    sorry and no native_decide, and that every audited capstone prints exactly
    propext, Classical.choice, and Quot.sound; GQ2/AxiomLedger.lean walks every
    declaration under GQ2 (7486 at the census flip, all at the standard three). The
    Tau Ceti route is checked by GQ2/TauCetiAxiomAudit.lean, which imports only
    GQ2.TauCeti.Main and checks that none of the nine legacy declarations is in its
    import closure and that the four Tau Ceti capstones use exactly the standard
    three. The Palomar route is checked by GQ2/PalomarAxiomAudit.lean, which imports
    only SolutionPalomar and checks that both exported solutions use only propext,
    Classical.choice, and Quot.sound. The two Palomar-facing main results are
    independently checkable with leanprover/comparator through
    comparator-config-palomar.json (ChallengePalomar.lean / SolutionPalomar.lean); the
    legacy pair (Challenge.lean / Solution.lean, comparator-config.json) now permits
    only the standard three axioms. The Lean Compass report (atlas-audit.md, a
    2026-07-26 snapshot taken before the Tau Ceti discharge) identifies 30 project
    declarations for human semantic review; those declarations have not yet received
    external human review. The Gamma_R result, the proof of GQ2.Roe.Labute.bLab, and
    the Tau Ceti adapters in GQ2/TauCeti/ have likewise had no external human review.

alignment:
  namespace: "GQ2"
  statements:
    - source: "Presentation theorem (Theorem 1.2 in the retained original PDF)"
      lean: "GQ2.main_presentation_literal"
      module: "GQ2/PresentationLiteral.lean"
      status: "proved"
      note: >
        Literal form: Nonempty (ContinuousMulEquiv GammaA AbsGalQ2), with no hypothesis;
        uses only the standard three Lean axioms. Same statement on the Tau Ceti route:
        GQ2.main_presentation_literal_tauceti (GQ2/TauCeti/Main.lean). Explicit-input
        form: GQ2.main_presentation_literal_of_inputs
        (GQ2/PresentationLiteralWithInputs.lean).
    - source: "Presentation theorem, surjection-count form (Theorem 1.2 in the retained original PDF)"
      lean: "GQ2.SectionTen.main_surjection_count'"
      module: "GQ2/SectionTenSources.lean"
      status: "proved"
      note: >
        #{continuous surjections G_Q2 ->> G} = #{admissible marked quadruples in G^4},
        with no hypothesis. Same statement on the Tau Ceti route:
        GQ2.main_surjection_count_tauceti (GQ2/TauCeti/Main.lean). Explicit-input form:
        GQ2.SectionTen.main_surjection_count_of_inputs (GQ2/SectionTenSourcesWithInputs.lean).
    - source: "Definition of the candidate group Gamma_A (equation (7) in the retained original PDF)"
      lean: "GQ2.GammaA"
      module: "GQ2/GammaA.lean"
      status: "proved"
      note: "largest quotient of the free profinite group F_4 all of whose finite quotients are admissible"
    - source: "Admissible-marking count for Gamma_A (Proposition 2.3 in the retained original PDF)"
      lean: "GQ2.prop_2_3"
      module: "GQ2/Prop23.lean"
      status: "proved"
    - source: "Literature inputs B1-B11a (Appendix B in the retained original PDF)"
      lean: "GQ2.TauCetiBridge.tauCetiInputs"
      module: "GQ2/TauCeti/Instance.lean"
      status: "proved"
      note: >
        The nine cited inputs, bundled as the typeclass GQ2.LiteratureInputs
        (GQ2/Foundations/LiteratureInputs.lean), each proved from Tau Ceti (revision
        706344c35) by an adapter in GQ2/TauCeti/; standard three axioms only. The instance
        GQ2.tauCetiLiteratureInputs and the nine legacy names, with statements
        byte-identical to the axioms they replaced on 2026-10-17, are in
        GQ2/Foundations/TauCetiInstance.lean. Per-input citations and encoding choices:
        docs/literature-axioms.md.
    # Roe-candidate verification. Not in the original paper: a later campaign asking whether a
    # different candidate group, Gamma_R, also presents G_Q2.
    - source: "Replacement theorem (Roe candidate; not in the original PDF)"
      lean: "GQ2.main_presentation_literal_roe_unconditional"
      module: "GQ2/Roe/Main.lean"
      status: "proved"
      note: >
        Literal form: Nonempty (ContinuousMulEquiv GammaR AbsGalQ2), with no hypothesis;
        the former BLabHypothesis is discharged by GQ2.Roe.Labute.bLab, and the theorem
        uses only the standard three Lean axioms. Same statement on the Tau Ceti route:
        GQ2.main_presentation_literal_roe_tauceti (GQ2/TauCeti/Main.lean).
        Explicit-input form: GQ2.main_presentation_literal_roe_unconditional_of_inputs
        (GQ2/Roe/MainWithInputs.lean).
    - source: "Labute classification instance for Gamma_R (Cor. 3.4 of the Roe note; D_R = D_0)"
      lean: "GQ2.Roe.Labute.bLab"
      module: "GQ2/Roe/Labute/Assembly.lean"
      status: "proved"
      note: >
        BLabHypothesis, proved rather than assumed: levelwise nonemptiness along the
        two-central tower gives continuous epimorphisms both ways between D_R and D_0,
        and the profinite Hopfian endgame turns them into an isomorphism. Standard three
        axioms only; no literature input is used.
    - source: "Replacement theorem, surjection-count form (Roe candidate; not in the original PDF)"
      lean: "GQ2.main_surjection_count_R_tauceti"
      module: "GQ2/TauCeti/Main.lean"
      status: "proved"
      note: >
        #{continuous surjections G_Q2 ->> G} = #{admissible Roe-marked quadruples in
        G^4}, with no hypothesis: GQ2.main_surjection_count_R_of_inputs at the Tau Ceti
        bundle and GQ2.Roe.Labute.bLab. The legacy GQ2.main_surjection_count_R
        (GQ2/Roe/Main.lean) states the same with an explicit hBLab : BLabHypothesis
        argument, which GQ2.Roe.Labute.bLab discharges.
    - source: "Definition of the Roe candidate group Gamma_R (not in the original PDF)"
      lean: "GQ2.GammaR"
      module: "GQ2/Roe/GammaR.lean"
      status: "proved"
      note: "unconditional: the definition and its basic theory need no literature input"
    - source: "Admissible-marking count for Gamma_R (Roe analogue of Proposition 2.3)"
      lean: "GQ2.prop_2_3_R"
      module: "GQ2/Roe/Prop23.lean"
      status: "proved"
      note: "unconditional and at the standard three axioms; no literature input is used"
    - source: "Agreement of the two admissible-marking semantics (Roe campaign)"
      lean: "GQ2.admissibleCountR_eq_admissibleCount"
      module: "GQ2/Roe/Main.lean"
      status: "proved"
      note: >
        admissibleCountR G = admissibleCount G for every finite G, at the standard three
        axioms. The declaration takes an explicit hBLab : BLabHypothesis argument, which
        GQ2.Roe.Labute.bLab discharges; the explicit-input form is
        GQ2.admissibleCountR_eq_admissibleCount_of_inputs (GQ2/Roe/MainWithInputs.lean).
        Independently pinned numerically on C2, C4, V4, D4, and Q8 by two Python engines
        and the June LMFDB-verified counts (GQ2/Roe/Sanity.lean).

