status:
  scope: >
    Complete end-to-end formalization of the paper's main result (numbered Theorem 1.2
    in the retained original PDF): the absolute Galois group of Q_2 is isomorphic as a
    profinite group to an explicit 4-generator 2-relator marked quotient Gamma_A,
    together with the surjection-count form (for every finite G, the number of
    continuous surjections G_Q2 ->> G equals the number of admissible marked
    quadruples in G^4).

    The capstones GQ2.main_presentation_literal and GQ2.SectionTen.main_surjection_count'
    are sorry-free, take no hypothesis, and use only Lean's standard three axioms:
    propext, Classical.choice, and Quot.sound. On this branch (`dyadic`) the two K-level inputs of the
    dyadic campaign, B5-K markedRecipAt and B10-K orientedTameQuotientAt, were the last axiom
    declarations (census 2 after the merge of the Q_2 discharge); ticket C1' of
    docs/dyadic/tauceti-discharge-plan.md proved them from Tau Ceti too
    (GQ2/TauCeti/{GaloisDictK,B5K,B10K}.lean, 2026-10-17), so the census is 0 here as well. Every other declaration under GQ2 uses only the standard
    three (GQ2/AxiomLedger.lean). The nine cited local-arithmetic inputs of the paper's
    Appendix B (B1, B3c, B5, B6, B7, B8, B9, B10, B11a), which Mathlib does not
    provide, were stated in this repository as axioms until 2026-10-17. They are now
    proved from the Tau Ceti library (https://github.com/TauCetiProject/TauCeti,
    revision 706344c35) by adapters in GQ2/TauCeti/. Nothing is assumed beyond Lean's
    standard three axioms; the trust base is Lean's kernel, Mathlib, and Tau Ceti's
    proofs at that revision. Tau Ceti is machine-written and enforces zero sorries and
    an axiom allowlist in its own CI; a sorry or non-standard axiom in its proofs of
    the nine inputs would appear in the axiom prints audited here.

    The nine legacy public names are kept, with statements byte-identical to the
    former axioms, as theorems and definitions in GQ2/Foundations/TauCetiInstance.lean
    whose bodies are the adapters; that file also registers the LiteratureInputs
    instance. GQ2/TauCeti/Main.lean restates the capstones with the Tau Ceti bundle
    passed explicitly, independent of instance selection
    (GQ2.main_presentation_literal_tauceti, GQ2.main_presentation_literal_roe_tauceti,
    GQ2.main_surjection_count_tauceti, GQ2.main_surjection_count_R_tauceti). The
    explicit-input route is retained: the `_of_inputs` capstones take
    [LiteratureInputs] as a hypothesis and are packaged for Comparator separately
    (comparator-config-palomar.json).

    A second main result, GQ2.main_presentation_literal_roe_unconditional, proves the
    same literal isomorphism for a different candidate group Gamma_R (not in the
    paper), with exactly the same axioms as the Gamma_A result.
  # Counts and axiom inventory for the whole GQ2 library: axiom census 0 since 2026-10-17
  # (scripts/check_axioms.sh, GQ2/AxiomLedger.lean).
  sorry_count: 0
  sorry_in_definitions: 0
  axioms:
    - "propext"
    - "Classical.choice"
    - "Quot.sound"
  main_results:
    # The two unconditional capstones, as certified by the Comparator pair Challenge.lean /
    # Solution.lean. Their Tau Ceti-route twins with identical statements are
    # GQ2.main_presentation_literal_tauceti and GQ2.main_presentation_literal_roe_tauceti
    # (GQ2/TauCeti/Main.lean, audited by GQ2/TauCetiAxiomAudit.lean).
    - declaration: "GQ2.main_presentation_literal"
      file: "GQ2/PresentationLiteral.lean"
      sorry_count: 0
      axioms:
        - "propext"
        - "Classical.choice"
        - "Quot.sound"
      comparator_config: "comparator-config.json"
      literature_dependencies:
        - "B1: G_Q2 is topologically finitely generated. Proved via Tau Ceti: adapter GQ2.TauCetiBridge.absGalQ2_isTopologicallyFinitelyGenerated_tauceti (GQ2/TauCeti/B1.lean) from TauCeti.isTopologicallyFinitelyGenerated_absoluteGaloisGroup"
        - "B7: local Euler characteristic formula at p = 2. Proved via Tau Ceti: adapter GQ2.TauCetiBridge.absGalQ2_localEulerCharacteristic_tauceti (GQ2/TauCeti/B7.lean, M : Type; transported to M : Type* in GQ2/Foundations/TauCetiInstance.lean) from TauCeti.ClassFieldTheory.eulerCharacteristic_mixed and TauCeti.ClassFieldTheory.finite_H"
        - "B3c: dyadic orientation / cyclotomic normalization. Proved via Tau Ceti: adapter GQ2.TauCetiBridge.dyadicOrientation_tauceti (GQ2/TauCeti/B3c.lean) from TauCeti.absoluteGaloisGroupProP_two_ratPadic_marked and TauCeti.standardD0Orientation_d0A/_d0S/_d0Y"
        - "B5: local reciprocity for Q_2. Proved via Tau Ceti: adapter GQ2.TauCetiBridge.localReciprocity_tauceti (GQ2/TauCeti/B5.lean) from TauCeti.ClassFieldTheory.artinMap and its continuity, density, restriction, kernel and cyclotomic-character lemmas (TauCeti.NumberTheory.ClassFieldTheory.Local.*)"
        - "B6: local Tate duality at finite extensions of Q_2. Proved via Tau Ceti: adapter GQ2.TauCetiBridge.tateDualityAt_tauceti (GQ2/TauCeti/B6.lean, GQ2/TauCeti/DualizingGroup.lean) from TauCeti.ClassFieldTheory.tateDualityPairing_perfect_mixed and TauCeti.ClassFieldTheory.h2MuEquivZMod_mixed"
        - "B8: peripheral cyclotomic action. Proved via Tau Ceti: adapter GQ2.TauCetiBridge.peripheralCyclotomicAction_tauceti (GQ2/TauCeti/B8.lean) from TauCeti.Peripheral.exists_peripheralPowerAutomorphism_two"
        - "B9: relative Stiefel-Whitney identity, dyadic case. Proved via Tau Ceti: adapter GQ2.TauCetiBridge.relativeStiefelWhitney_dyadic_tauceti (GQ2/TauCeti/B9.lean, GQ2/TauCeti/StiefelWhitneyDict.lean) from TauCeti.sw1_eq_add_galoisCor_of_equivalent_traceTransfer and TauCeti.sw2_eq_add_galoisEvens_add_cup_of_equivalent_traceTransfer"
        - "B10: oriented tame quotient structure of G_Q2. Proved via Tau Ceti: adapter GQ2.TauCetiBridge.tameQuotient_tauceti (GQ2/TauCeti/B10.lean) from TauCeti.wildInertiaSubgroup, TauCeti.isProP_wildInertiaSubgroup, TauCeti.tameQuotientGeometricEquiv and TauCeti.iwasawaCoordinateGeometric"
        - "B11a: Hilbert-symbol norm criterion for finite dyadic extensions. Proved via Tau Ceti: adapter GQ2.TauCetiBridge.hilbertSymbol_normCriterion_finiteDyadic_tauceti (GQ2/TauCeti/B11a.lean) from TauCeti.cup_kummerClass_eq_zero_iff"
    - declaration: "GQ2.main_presentation_literal_roe_unconditional"
      file: "GQ2/Roe/Main.lean"
      sorry_count: 0
      axioms:
        - "propext"
        - "Classical.choice"
        - "Quot.sound"
      comparator_config: "comparator-config.json"
      literature_dependencies:
        - "B1: G_Q2 is topologically finitely generated. Proved via Tau Ceti: adapter GQ2.TauCetiBridge.absGalQ2_isTopologicallyFinitelyGenerated_tauceti (GQ2/TauCeti/B1.lean) from TauCeti.isTopologicallyFinitelyGenerated_absoluteGaloisGroup"
        - "B7: local Euler characteristic formula at p = 2. Proved via Tau Ceti: adapter GQ2.TauCetiBridge.absGalQ2_localEulerCharacteristic_tauceti (GQ2/TauCeti/B7.lean, M : Type; transported to M : Type* in GQ2/Foundations/TauCetiInstance.lean) from TauCeti.ClassFieldTheory.eulerCharacteristic_mixed and TauCeti.ClassFieldTheory.finite_H"
        - "B3c: dyadic orientation / cyclotomic normalization. Proved via Tau Ceti: adapter GQ2.TauCetiBridge.dyadicOrientation_tauceti (GQ2/TauCeti/B3c.lean) from TauCeti.absoluteGaloisGroupProP_two_ratPadic_marked and TauCeti.standardD0Orientation_d0A/_d0S/_d0Y"
        - "B5: local reciprocity for Q_2. Proved via Tau Ceti: adapter GQ2.TauCetiBridge.localReciprocity_tauceti (GQ2/TauCeti/B5.lean) from TauCeti.ClassFieldTheory.artinMap and its continuity, density, restriction, kernel and cyclotomic-character lemmas (TauCeti.NumberTheory.ClassFieldTheory.Local.*)"
        - "B6: local Tate duality at finite extensions of Q_2. Proved via Tau Ceti: adapter GQ2.TauCetiBridge.tateDualityAt_tauceti (GQ2/TauCeti/B6.lean, GQ2/TauCeti/DualizingGroup.lean) from TauCeti.ClassFieldTheory.tateDualityPairing_perfect_mixed and TauCeti.ClassFieldTheory.h2MuEquivZMod_mixed"
        - "B8: peripheral cyclotomic action. Proved via Tau Ceti: adapter GQ2.TauCetiBridge.peripheralCyclotomicAction_tauceti (GQ2/TauCeti/B8.lean) from TauCeti.Peripheral.exists_peripheralPowerAutomorphism_two"
        - "B9: relative Stiefel-Whitney identity, dyadic case. Proved via Tau Ceti: adapter GQ2.TauCetiBridge.relativeStiefelWhitney_dyadic_tauceti (GQ2/TauCeti/B9.lean, GQ2/TauCeti/StiefelWhitneyDict.lean) from TauCeti.sw1_eq_add_galoisCor_of_equivalent_traceTransfer and TauCeti.sw2_eq_add_galoisEvens_add_cup_of_equivalent_traceTransfer"
        - "B10: oriented tame quotient structure of G_Q2. Proved via Tau Ceti: adapter GQ2.TauCetiBridge.tameQuotient_tauceti (GQ2/TauCeti/B10.lean) from TauCeti.wildInertiaSubgroup, TauCeti.isProP_wildInertiaSubgroup, TauCeti.tameQuotientGeometricEquiv and TauCeti.iwasawaCoordinateGeometric"
        - "B11a: Hilbert-symbol norm criterion for finite dyadic extensions. Proved via Tau Ceti: adapter GQ2.TauCetiBridge.hilbertSymbol_normCriterion_finiteDyadic_tauceti (GQ2/TauCeti/B11a.lean) from TauCeti.cup_kummerClass_eq_zero_iff"
    # The explicit-input route. For these two declarations the nine inputs are fields of the
    # explicit [LiteratureInputs] hypothesis (GQ2/Foundations/LiteratureInputs.lean);
    # GQ2.TauCetiBridge.tauCetiInputs (GQ2/TauCeti/Instance.lean) supplies all nine, which gives
    # the unconditional entries above.
    - declaration: "GQ2.main_presentation_literal_of_inputs"
      file: "GQ2/PresentationLiteralWithInputs.lean"
      sorry_count: 0
      axioms:
        - "propext"
        - "Classical.choice"
        - "Quot.sound"
      comparator_config: "comparator-config-palomar.json"
      literature_dependencies:
        - "B1: G_Q2 is topologically finitely generated"
        - "B7: local Euler characteristic formula at p = 2"
        - "B3c: dyadic orientation / cyclotomic normalization"
        - "B5: local reciprocity for Q_2"
        - "B6: local Tate duality at finite extensions of Q_2"
        - "B8: peripheral cyclotomic action"
        - "B9: relative Stiefel-Whitney identity, dyadic case"
        - "B10: oriented tame quotient structure of G_Q2"
        - "B11a: Hilbert-symbol norm criterion for finite dyadic extensions"
    - declaration: "GQ2.main_presentation_literal_roe_unconditional_of_inputs"
      file: "GQ2/Roe/MainWithInputs.lean"
      sorry_count: 0
      axioms:
        - "propext"
        - "Classical.choice"
        - "Quot.sound"
      comparator_config: "comparator-config-palomar.json"
      literature_dependencies:
        - "B1: G_Q2 is topologically finitely generated"
        - "B7: local Euler characteristic formula at p = 2"
        - "B3c: dyadic orientation / cyclotomic normalization"
        - "B5: local reciprocity for Q_2"
        - "B6: local Tate duality at finite extensions of Q_2"
        - "B8: peripheral cyclotomic action"
        - "B9: relative Stiefel-Whitney identity, dyadic case"
        - "B10: oriented tame quotient structure of G_Q2"
