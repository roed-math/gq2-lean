automation:
  methods:
    - method: "agent"
      models: ["claude-opus-4-8", "claude-fable-5"]
      framework: "Claude Code"
      tool_setup: >
        Multi-agent orchestrator-worker swarm: a main orchestrating session dispatched
        parallel worker agents per ticket/file, coordinated through an on-disk ticket
        board, per-ticket plans, and handoff documents (raw archive preserved in
        docs/orchestration/). Workers used the lean-lsp MCP server and streaming
        `lake build` verification; an axiom-hygiene gate (scripts/check_axioms.sh)
        enforced the literature-input dependency boundary, zero sorries, and no
        native_decide on every wave. A post-completion 34-wave cleanup marathon (mathlib-quality skill
        suite: per-file golf, renames, cross-file dedup, proof decomposition, file
        splitting) improved the Lean code quality, though not up to mathlib standards.
      cost:
        wall_time: "~2 weeks wall clock (2026-07-01 to 2026-07-14); main proof complete 2026-07-08"
        spend_usd: "$600 (three Claude Max 20 subscriptions)"
        hardware: "a single Macbook Pro laptop"
      prompting_notes: >
        Per-ticket briefs with acceptance criteria and axiom budgets (see
        docs/orchestration/tickets.md and p*.md plan files); cleanup-phase worker
        prompts enforced byte-identical theorem statements, streaming-only builds,
        and anti-destruction rules for parallel lanes.
    - method: "AI-assisted"
      models: ["gpt-5.6"]
      framework: "OpenAI Codex"
      tool_setup: >
        Repository inspection, Lean refactoring, kernel builds, environment-level axiom
        audits, metadata validation, and Comparator packaging.
      cost:
        wall_time: "one implementation session"
        spend_usd: "subscription-based"
        hardware: "local development container plus API"
      prompting_notes: >
        Refactor the literature-dependent proof graph to take an explicit bundled
        hypothesis and package the explicit-input Palomar Comparator entry points.
  spend_usd: "$600 (three Claude Max 20 subscriptions)"
  notes: >
    Human role was orchestration-level: approving trust-base changes, owner-gated
    design decisions, and review checkpoints; the Lean code was written by the agent
    swarm. Commit trailers record the models used per commit.

fidelity:
  divergences: >
    Statements track the paper closely; module docstrings carry paper-tag ledgers
    mapping equations and propositions to declarations. Known deviations: (i) the nine
    literature inputs are not proved in-repository. The `_of_inputs`
    capstones take them as fields of an explicit `[LiteratureInputs]` hypothesis. The
    bundled B7 field uses `M : Type`, which covers every consumer in this development;
    (ii) a transcription erratum in the paper's H^0 bookkeeping was found and corrected
    during formalization (docs/erratum-h0-transcription.md); (iii) helper-lemma names
    follow mathlib conventions rather than paper numbering; (iv) on 2026-07-24 B9 was
    restated as the relative Stiefel-Whitney identity
    (relativeStiefelWhitney_dyadic), and the previous composite B9 statement is now a
    derived theorem (evensKahn_dyadic) proved from it plus B11a; (v) the Gamma_R
    "Replacement theorem" (GQ2/Roe/) is not part of the paper and verifies a different
    candidate group proposed afterward. Its former extra input, the Labute
    classification instance, was carried as the explicit theorem binder BLabHypothesis
    rather than admitted as an axiom, and was discharged in-repository on 2026-07-26 by
    GQ2.Roe.Labute.bLab. Thus the `_of_inputs` Gamma_R capstone is unconditional with
    respect to BLabHypothesis but remains conditional on the same LiteratureInputs
    bundle as the Gamma_A capstone.

review:
  status: "agent-reviewed"
  reviewers: []
  notes: >
    No external human peer review yet. Internal review includes a foundations audit
    (docs/foundations-audit.md), off-path statement checks
    (docs/off-path-statements.md), kernel-checked builds, zero-sorry enforcement, and
    transitive environment audits. The Palomar route is checked by
    GQ2/PalomarAxiomAudit.lean, which imports only SolutionPalomar and checks
    that both exported solutions use only propext, Classical.choice, and Quot.sound. The two Palomar-facing main results are
    independently checkable with leanprover/comparator through
    comparator-config-palomar.json (ChallengePalomar.lean / SolutionPalomar.lean). The
    post-refactor Lean Compass report identifies 30 project declarations for human
    semantic review (atlas-audit.md); those declarations have not yet received external
    human review. The Gamma_R result and the proof of GQ2.Roe.Labute.bLab have likewise
    had no external human review.

alignment:
  namespace: "GQ2"
  statements:
    - source: "Presentation theorem (Theorem 1.2 in the retained original PDF)"
      lean: "GQ2.main_presentation_literal_of_inputs"
      module: "GQ2/PresentationLiteralWithInputs.lean"
      status: "proved-from-explicit-literature-inputs"
      note: >
        Literal form: Nonempty (ContinuousMulEquiv GammaA AbsGalQ2), conditional on
        the explicit [LiteratureInputs] bundle; proof term uses only the standard three
        Lean axioms.
    - source: "Presentation theorem, surjection-count form (Theorem 1.2 in the retained original PDF)"
      lean: "GQ2.SectionTen.main_surjection_count_of_inputs"
      module: "GQ2/SectionTenSourcesWithInputs.lean"
      status: "proved-from-explicit-literature-inputs"
      note: >
        #{continuous surjections G_Q2 ->> G} = #{admissible marked quadruples in G^4},
        conditional on [LiteratureInputs].
    - source: "Definition of the candidate group Gamma_A (equation (7) in the retained original PDF)"
      lean: "GQ2.GammaA"
      module: "GQ2/GammaA.lean"
      status: "proved"
      note: "largest quotient of the free profinite group F_4 all of whose finite quotients are admissible"
    - source: "Admissible-marking count for Gamma_A (Proposition 2.3 in the retained original PDF)"
      lean: "GQ2.prop_2_3"
      module: "GQ2/Prop23.lean"
      status: "proved"
    - source: "Literature inputs B1-B11a (Appendix B in the retained original PDF)"
      lean: "GQ2.LiteratureInputs"
      module: "GQ2/Foundations/LiteratureInputs.lean"
      status: "explicit-literature-dependency"
      note: >
        Bundle of nine cited inputs, supplied as an ordinary typeclass hypothesis and
        not constructed in-repository.
    # Roe-candidate verification. Not in the original paper: a later campaign asking whether a
    # different candidate group, Gamma_R, also presents G_Q2.
    - source: "Replacement theorem (Roe candidate; not in the original PDF)"
      lean: "GQ2.main_presentation_literal_roe_unconditional_of_inputs"
      module: "GQ2/Roe/MainWithInputs.lean"
      status: "proved-from-explicit-literature-inputs"
      note: >
        Literal form: Nonempty (ContinuousMulEquiv GammaR AbsGalQ2). The former
        BLabHypothesis is discharged by GQ2.Roe.Labute.bLab; the theorem remains
        conditional on [LiteratureInputs] and uses only the standard three Lean axioms.
    - source: "Labute classification instance for Gamma_R (Cor. 3.4 of the Roe note; D_R = D_0)"
      lean: "GQ2.Roe.Labute.bLab"
      module: "GQ2/Roe/Labute/Assembly.lean"
      status: "proved"
      note: >
        BLabHypothesis, proved rather than assumed: levelwise nonemptiness along the
        two-central tower gives continuous epimorphisms both ways between D_R and D_0,
        and the profinite Hopfian endgame turns them into an isomorphism. Standard three
        axioms only; no literature input is used.
    - source: "Replacement theorem, surjection-count form (Roe candidate; not in the original PDF)"
      lean: "GQ2.main_surjection_count_R_of_inputs"
      module: "GQ2/Roe/MainWithInputs.lean"
      status: "proved-from-explicit-literature-inputs-and-BLabHypothesis"
      note: >
        #{continuous surjections G_Q2 ->> G} = #{admissible Roe-marked quadruples in
        G^4}. The declaration takes both [LiteratureInputs] and an explicit
        hBLab : BLabHypothesis argument; GQ2.Roe.Labute.bLab can discharge hBLab when
        an unconditional corollary is needed.
    - source: "Definition of the Roe candidate group Gamma_R (not in the original PDF)"
      lean: "GQ2.GammaR"
      module: "GQ2/Roe/GammaR.lean"
      status: "proved"
      note: "unconditional: the definition and its basic theory need no literature input"
    - source: "Admissible-marking count for Gamma_R (Roe analogue of Proposition 2.3)"
      lean: "GQ2.prop_2_3_R"
      module: "GQ2/Roe/Prop23.lean"
      status: "proved"
      note: "unconditional and at the standard three axioms; no literature input is used"
    - source: "Agreement of the two admissible-marking semantics (Roe campaign)"
      lean: "GQ2.admissibleCountR_eq_admissibleCount_of_inputs"
      module: "GQ2/Roe/MainWithInputs.lean"
      status: "proved-from-explicit-literature-inputs-and-BLabHypothesis"
      note: >
        admissibleCountR G = admissibleCount G for every finite G. The declaration
        takes both [LiteratureInputs] and an explicit hBLab : BLabHypothesis argument;
        GQ2.Roe.Labute.bLab can discharge hBLab in downstream use. Independently
        pinned numerically on C2, C4, V4, D4, and Q8 by two Python engines and the June
        LMFDB-verified counts (GQ2/Roe/Sanity.lean).

